<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Funny Pig Prank 😜</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff6a88, #ffcc70);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.box {
    background: #fff;
    width: 92%;
    max-width: 360px;
    padding: 25px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h1 {
    font-size: 22px;
    margin-bottom: 25px;
}

.buttons {
    position: relative;
    height: 100px;
}

button {
    padding: 12px 30px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
}

#yes {
    background: #28a745;
    color: #fff;
}

#no {
    background: #dc3545;
    color: #fff;
    position: absolute;
    left: 180px;
}

.result {
    display: none;
    margin-top: 20px;
    animation: pop 0.6s ease;
}

.result img {
    width: 220px;
}

@keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="box">
    <h1>Kartik Paliwal,<br>kya aap suwar hain? 🐷</h1>

    <div class="buttons">
        <button id="yes">YES</button>
        <button id="no">NO</button>
    </div>

    <div class="result" id="result">
        <h2>😂 HA HA HA 😂</h2>
        <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
    </div>
</div>

<audio id="sound">
    <source src="https://www.myinstants.com/media/sounds/cartoon-laugh.mp3">
</audio>

<script>
// Auto fullscreen on first tap
document.body.addEventListener("click", () => {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
}, { once: true });

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const result = document.getElementById("result");
const sound = document.getElementById("sound");

function moveNo() {
    const x = Math.random() * 220 - 110;
    const y = Math.random() * 160 - 80;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("touchstart", moveNo);

yesBtn.addEventListener("click", () => {
    result.style.display = "block";
    sound.play();
});
</script>

</body>
</html>
