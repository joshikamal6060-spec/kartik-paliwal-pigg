<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kartik Paliwal 😂</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Sans MS', cursive;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
      text-align: center;
      animation: zoomIn 1.5s ease;
    }

    h1 {
      color: #ff4d4d;
      font-size: 32px;
    }

    p {
      font-size: 20px;
      color: #333;
    }

    img {
      width: 200px;
      margin: 20px 0;
      animation: bounce 2s infinite;
    }

    .btn {
      padding: 12px 25px;
      font-size: 18px;
      background: #ff4d4d;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn:hover {
      background: #e60000;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes zoomIn {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>😂 Surprise Kartik Paliwal 😂</h1>

    <p>World ka sabse cute 🐷 mil gaya!</p>

    <img src="https://media.tenor.com/4K6hV8Z6m0IAAAAC/pig-funny.gif">

    <p>
      Kartik bhai,<br>
      Tu itna innocent hai ki<br>
      pig bhi sharma jaaye 🤣
    </p>

    <button class="btn" onclick="alert('🐷 Oink Oink! Kartik is legend 🤣')">
      Click for Truth 😜
    </button>
  </div>

</body>
</html>
